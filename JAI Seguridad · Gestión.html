<style>
/* Layout: barra lateral fija con secciones; contenido en grillas de paneles. Colores tomados del logo: azul JAI + celeste del ojo. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#141b2d; --muted:#5c6577; --line:#dfe2ea;
  --navy:#1d2a55; --navy-ink:#e9edf6; --accent:#1f78c8; --accent-soft:#e3effa; --on-accent:#ffffff;
  --good:#1f7a4d; --good-soft:#e2f3ea; --warn:#a86200; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe5e3; --info:#2c5aa0; --info-soft:#e4ecf8;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif; --body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1320; --panel:#161d2e; --ink:#e7eaf2; --muted:#98a1b5; --line:#283149;
  --navy:#0c1430; --navy-ink:#dfe5f2; --accent:#5aaef0; --accent-soft:#16304d; --on-accent:#06182b;
  --good:#5cc592; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#352812; --bad:#f08a80; --bad-soft:#3a1916; --info:#86adf0; --info-soft:#18284a; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1320; --panel:#161d2e; --ink:#e7eaf2; --muted:#98a1b5; --line:#283149;
  --navy:#0c1430; --navy-ink:#dfe5f2; --accent:#5aaef0; --accent-soft:#16304d; --on-accent:#06182b;
  --good:#5cc592; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#352812; --bad:#f08a80; --bad-soft:#3a1916; --info:#86adf0; --info-soft:#18284a; color-scheme: dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{background:var(--navy);color:var(--navy-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand{flex-direction:column;align-items:stretch!important}
.brand img{display:block;width:100%;max-width:190px;background:#fff;border-radius:10px;padding:8px 10px;box-sizing:border-box}
.brand small{padding-left:2px}
.brand b{font:800 17px var(--display);display:block;letter-spacing:.02em}
.brand small{opacity:.7;font-size:12px}
nav.side a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
nav.side a:hover{background:rgba(255,255,255,.07)}
nav.side a.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--accent)}
nav.side a.sub{padding-left:26px;font-size:14px;opacity:.85}
nav.side a .cnt{font-size:12px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:10px}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:8px}
main{padding:24px clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel>h2,.panel>h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.cot{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .v{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted)}
.tile.alert{border-left:4px solid var(--bad)} .tile.ok{border-left:4px solid var(--good)} .tile.acc{border-left:4px solid var(--accent)} .tile.inf{border-left:4px solid var(--info)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:600 14px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.pri:hover{filter:brightness(1.05)}
button.dark{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mut{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .p-acc{background:var(--warn-soft);color:var(--warn)}
.prod{display:grid;grid-template-columns:56px 1fr auto;gap:4px 12px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:start}
.prod .pimg{grid-row:1/3;grid-column:1}
.prod .t{font-weight:600;grid-column:2}
.prod .d{font-size:13px;color:var(--muted);grid-column:2}
.prod .pr{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pimg,.cimg{display:block;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.pimg{width:56px;height:56px} .cimg{width:40px;height:40px;border-radius:6px}
.nofoto{background:var(--bg)}
a.wa{display:inline-flex;align-items:center;gap:6px;background:#1f9d55;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px}
a.wa.sm{font-size:13px;padding:4px 10px}
a.wa:hover{filter:brightness(1.07)}
.combo{position:relative;min-width:0}
.combo input{width:100%}
.combo .chosen{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 6px 5px 12px;font-weight:600}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,14,24,.18);z-index:30;max-height:300px;overflow:auto;padding:4px}
.combo-list .opt{display:flex;flex-direction:column;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.combo-list .opt .muted{font-size:12.5px}
.combo-list .opt.on,.combo-list .opt[data-id]:hover{background:var(--accent-soft)}
.prod .pv{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.prod .pc{font-size:12px;color:var(--muted)}
.list{max-height:62vh;overflow:auto}
.qty{width:64px;text-align:right} .pu{width:110px;text-align:right}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 16px;justify-items:end;font-variant-numeric:tabular-nums;margin-top:10px}
.tot .big{font:800 22px var(--display)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.info{background:var(--info-soft);color:var(--info)} .banner.good{background:var(--good-soft);color:var(--good)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50;max-width:360px}
#toast.on{opacity:1;transform:none}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,24,.5);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--panel);border-radius:14px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.saldo-pos{color:var(--bad);font-weight:700} .saldo-neg{color:var(--good);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);padding:8px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:900px){.app{grid-template-columns:1fr} nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px} .brand{padding:4px 8px} .side .foot{display:none} .cot{grid-template-columns:1fr}}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const money = n => fmt.format(Math.round(Number(n)||0));
const fdate = iso => { if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? "—" : d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}); };
const fdatetime = iso => { if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? "—" : d.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const today = () => new Date().toISOString().slice(0,10);
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3200); }
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }

/* ---------- estado ---------- */
const S = {
  db:null, user:null, ready:false,
  cfg:{margen:15, empresa:"JAI Seguridad", telefono:"", email:"", validez:7, pie:"Precios en pesos argentinos. Sujetos a disponibilidad de stock."},
  meta:null, chunks:{}, cat:[], propios:[], prop:[], all:[], catIdx:new Map(), fOrig:"",
  clientes:[], cotiz:[], pedidos:[], movs:[],
  cart:{id:null, clienteId:"", items:[], descuento:0, notas:"", validez:null},
  showCost:false, q:"", fMarca:"", fCat:"", soloStock:true,
  selCliente:null, clienteTab:"cuenta", listaQ:"", cliQ:"",
  fotos:new Map(), fotoBuckets:{}, fotosEstado:"", empleados:[], pagosEmp:[], selEmp:null, esDueno:true
};
const ESTADOS_COT = {borrador:["Pendiente","p-mut"], enviada:["Enviada","p-info"], aceptada:["Aceptada","p-good"], rechazada:["Rechazada","p-bad"], vencida:["Vencida","p-warn"]};
const ESTADOS_PED = {pendiente:["Pendiente","p-warn"], preparando:["En preparación","p-info"], entregado:["Entregado","p-good"], cancelado:["Cancelado","p-bad"]};

/* precio de venta = costo del proveedor + margen */
const venta = costo => costo>0 ? Math.round(costo*(1+(Number(S.cfg.margen)||0)/100)) : 0;
const cliNombre = id => (S.clientes.find(c=>c.id===id)||{}).nombre || "Sin cliente";
const saldoCliente = id => S.movs.filter(m=>m.clienteId===id).reduce((a,m)=>a+(m.tipo==="cargo"?1:-1)*(Number(m.importe)||0),0);
const cotNum = n => "COT-"+String(n||0).padStart(4,"0");
const pedNum = n => "PED-"+String(n||0).padStart(4,"0");
const nextNum = arr => arr.reduce((m,x)=>Math.max(m,Number(x.numero)||0),0)+1;

/* ---------- base de datos ---------- */
async function write(fn, okMsg){
  if(!S.db){ toast("La base de datos no está disponible en esta vista."); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument") toast("No tenés permiso para guardar cambios, o el dato es inválido.");
    else if(c==="quota_exceeded") toast("La base de datos está llena: "+(e.message||""));
    else toast("No se pudo guardar. Probá de nuevo en unos segundos.");
    console.error(e); return false;
  }
}
function rebuildCatalog(){
  const m=S.meta; const items=[];
  if(m && m.chunks){ for(let i=0;i<m.chunks;i++){ const c=S.chunks["c"+i]; if(c&&Array.isArray(c.items)) items.push(...c.items); } }
  S.cat = items.map(r=>({key:String(r[0]||""), codigo:String(r[0]||""), marca:String(r[1]||""), categoria:String(r[2]||""), costo:Number(r[3])||0, tag:String(r[4]||""), desc:String(r[5]||""), foto:String(r[6]||""), _k:norm(r[0]+" "+r[1]+" "+r[2]+" "+r[5])}));
  S.prop = S.propios.map(p=>({key:"P:"+p.id, id:p.id, propio:true, codigo:String(p.codigo||""), marca:String(p.marca||""), categoria:String(p.categoria||""), costo:Number(p.costo)||0, precioFijo:Number(p.precio)||0, margen:(p.margen===""||p.margen==null)?null:Number(p.margen), tag:"", desc:String(p.nombre||""), _k:norm([p.codigo,p.marca,p.categoria,p.nombre].join(" "))}));
  S.all = [...S.prop, ...S.cat];
  S.catIdx = new Map(S.all.map(p=>[p.key,p]));
}
/* precio de venta: los propios usan su precio fijo, o su costo + su margen (o el margen general) */
function precioDe(p){
  if(!p) return 0;
  if(!p.propio) return venta(p.costo);
  if(p.precioFijo>0) return Math.round(p.precioFijo);
  return p.costo>0 ? Math.round(p.costo*(1+(p.margen??(Number(S.cfg.margen)||0))/100)) : 0;
}
async function initDb(){
  const timer=setTimeout(()=>{ if(!S.ready) setBanner("warn","No se pudo conectar con la base de datos todavía. Los datos pueden no estar al día."); },10000);
  let db=null, user=null;
  try{ [db,user]=await Promise.all([window.claude?.use("db"), window.claude?.use("user")]); }catch(e){}
  S.db=db; S.user=user;
  if(!db){ clearTimeout(timer); setBanner("bad","Abrí esta página con tu cuenta de Claude para usar la base de datos."); return; }
  const onErr = e => { clearTimeout(timer); setBanner("bad","Se perdió la conexión con la base de datos. Recargá la página."); console.error(e); };
  const firstLoad = new Set();
  const mark = (k,snap) => { if(!snap.metadata.fromCache){ firstLoad.add(k); if(firstLoad.size>=7 && !S.ready){ S.ready=true; clearTimeout(timer); setBanner(null); flushPending(); } } };
  db.doc("config/general").onSnapshot(s=>{ if(s.exists) S.cfg={...S.cfg,...s.data()}; mark("cfg",s); render(); }, onErr);
  db.collection("catalogo").onSnapshot(s=>{ S.chunks={}; S.meta=null; s.docs.forEach(d=>{ if(d.id==="meta") S.meta=d.data(); else S.chunks[d.id]=d.data(); }); rebuildCatalog(); mark("cat",s); render(); }, onErr);
  const sub=(name,key,sortKey)=>db.collection(name).onSnapshot(s=>{ S[key]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b[sortKey]||"").localeCompare(String(a[sortKey]||""))); mark(name,s); render(); }, onErr);
  db.collection("propios").onSnapshot(s=>{ S.propios=s.docs.map(d=>({id:d.id,...d.data()})); rebuildCatalog(); mark("propios",s); render(); }, onErr);
  // empleados: solo el dueño y los editores pueden verlos (regla de la base de datos)
  try{ const ce=user&&user.canEdit?await user.canEdit():true; S.esDueno=ce!==false; }catch(e){}
  if(S.esDueno){
    db.collection("empleados").onSnapshot(s=>{ S.empleados=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>console.error(e));
    db.collection("pagosEmp").onSnapshot(s=>{ S.pagosEmp=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>console.error(e));
  }
  sub("clientes","clientes","creado"); sub("cotizaciones","cotiz","fecha"); sub("pedidos","pedidos","fecha"); sub("movimientos","movs","fecha");
}
function setBanner(kind,msg){ const b=$("#dbBanner"); if(!kind){ b.className="banner hide"; return; } b.className="banner "+kind; b.textContent=msg; }

/* ---------- importación de lista ---------- */
const pending=[];
function flushPending(){ while(pending.length){ const p=pending.shift(); importarLista(p.items,p.fuente,p.version,p.reply); } }
let importando=false;
async function importarLista(items, fuente, version, reply){
  const done = (ok,msg,extra) => { try{ reply && reply({type:"jai-ldp-ack",ok,msg,...(extra||{})}); }catch(e){} };
  if(!S.ready){ pending.push({items,fuente,version,reply}); return; }
  if(importando){ done(false,"Ya hay una importación en curso"); return; }
  const clean=[]; const seen=new Set();
  for(const r of items){
    if(!Array.isArray(r)) continue;
    const cod=String(r[0]||"").trim().slice(0,120); if(!cod || seen.has(cod)) continue; seen.add(cod);
    const costo=Math.max(0,Math.round(Number(r[3])||0));
    clean.push([cod,String(r[1]||"").slice(0,60),String(r[2]||"").slice(0,80),costo,String(r[4]||"").slice(0,40),String(r[5]||"").slice(0,400),fotoHash(r[6])]);
  }
  if(clean.length<20){ toast("La lista recibida está vacía o no tiene el formato esperado."); done(false,"Formato inválido o lista vacía"); return; }
  importando=true; setBanner("info","Actualizando la lista de precios ("+clean.length+" productos)…");
  // comparar con la lista anterior
  const prev=new Map(S.cat.map(p=>[p.codigo,p])); let subieron=0,bajaron=0,nuevos=0;
  for(const r of clean){ const p=prev.get(r[0]); if(!p) nuevos++; else if(r[3]>p.costo) subieron++; else if(r[3]<p.costo) bajaron++; }
  const nuevosSet=new Set(clean.map(r=>r[0])); let quitados=0; prev.forEach((_,k)=>{ if(!nuevosSet.has(k)) quitados++; });
  const SIZE=250, n=Math.ceil(clean.length/SIZE);
  const ok = await write(async()=>{
    for(let i=0;i<n;i++) await S.db.doc("catalogo/c"+i).set({items:clean.slice(i*SIZE,(i+1)*SIZE)});
    const oldN=(S.meta&&S.meta.chunks)||0;
    const hist=((S.meta&&S.meta.historial)||[]).slice(0,19);
    const entry={fecha:new Date().toISOString(),fuente:fuente||"Manual",total:clean.length,subieron,bajaron,nuevos,quitados};
    await S.db.doc("catalogo/meta").set({chunks:n,total:clean.length,actualizado:entry.fecha,fuente:entry.fuente,version:String(version||""),historial:[entry,...hist]});
    for(let i=n;i<oldN;i++) await S.db.doc("catalogo/c"+i).delete();
  });
  importando=false;
  if(ok){ setBanner("good","Lista actualizada: "+clean.length+" productos · "+subieron+" subieron, "+bajaron+" bajaron, "+nuevos+" nuevos."); setTimeout(()=>setBanner(null),8000); done(true,"ok",{total:clean.length,subieron,bajaron,nuevos,quitados}); }
  else { setBanner("bad","No se pudo guardar la lista nueva."); done(false,"Error al guardar"); }
}
/* ---------- fotos de productos ---------- */
// cada foto se guarda achicada (~3 KB) en 64 documentos "fotos/bNN", agrupadas por el inicio de su clave
const fotoHash = v => String(v||"").replace(/^ORIGEN_FOTO:/,"").replace(/[^0-9a-f]/gi,"").slice(0,16).toLowerCase();
const fotoBucket = h => "b"+String(parseInt(h.slice(0,2),16)%64).padStart(2,"0");
let fotosPromise=null;
function ensureFotos(){
  if(fotosPromise) return fotosPromise;
  if(!S.db) return Promise.resolve();
  S.fotosEstado="cargando";
  fotosPromise=S.db.collection("fotos").get().then(snap=>{
    snap.docs.forEach(d=>{ const f=(d.data()||{}).f||{}; S.fotoBuckets[d.id]={...f}; for(const h in f) S.fotos.set(h,f[h]); });
    S.fotosEstado="ok"; render();
  }).catch(e=>{ console.error(e); S.fotosEstado="error"; fotosPromise=null; });
  return fotosPromise;
}
const fotoImg = (h,cls) => { const u=h&&S.fotos.get(h); return u?`<img class="${cls}" src="${u}" alt="" loading="lazy">`:`<div class="${cls} nofoto" aria-hidden="true"></div>`; };
let fotoQueue=Promise.resolve(), fotoDirty=new Set();
function recibirFotos(fotos){
  let n=0;
  for(const [k,u] of Object.entries(fotos||{})){
    const h=fotoHash(k); if(!h||typeof u!=="string"||!u.startsWith("data:image/")||u.length>40000) continue;
    const b=fotoBucket(h); (S.fotoBuckets[b]=S.fotoBuckets[b]||{})[h]=u; S.fotos.set(h,u); fotoDirty.add(b); n++;
  }
  return n;
}
function guardarFotos(){
  // escribe solo los grupos que cambiaron, de a uno
  fotoQueue=fotoQueue.then(async()=>{
    const ids=[...fotoDirty]; fotoDirty=new Set(); let ok=0;
    for(const b of ids){ try{ await S.db.doc("fotos/"+b).set({f:S.fotoBuckets[b]}); ok++; }catch(e){ console.error(e); fotoDirty.add(b); } }
    return {ok,fallaron:ids.length-ok};
  });
  return fotoQueue;
}

// canal para la actualización automática: la pestaña del proveedor envía la lista a esta página
window.addEventListener("message", async e=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  const reply=m=>{ try{ e.source&&e.source.postMessage(m,"*"); }catch(x){} };
  if(d.type==="jai-ping"){ reply({type:"jai-pong",ready:S.ready}); return; }
  if(d.type==="jai-fotos-have"){ if(!S.ready){ reply({type:"jai-fotos-have-ack",ok:false,msg:"no listo"}); return; } await ensureFotos(); reply({type:"jai-fotos-have-ack",ok:S.fotosEstado==="ok",have:[...S.fotos.keys()]}); return; }
  if(d.type==="jai-fotos"){ const n=recibirFotos(d.fotos); let r={ok:0,fallaron:0}; if(d.guardar) r=await guardarFotos(); reply({type:"jai-fotos-ack",id:d.id,recibidas:n,...r,total:S.fotos.size}); if(d.guardar) render(); return; }
  if(d.type!=="jai-ldp"||!Array.isArray(d.items)) return;
  importarLista(d.items,"Proveedor · actualización automática",d.version,reply);
});
async function importarArchivo(file){
  try{
    let rows;
    if(/\.json$/i.test(file.name)){ const j=JSON.parse(await file.text()); rows=Array.isArray(j)?j:(j.items||[]); if(rows.length&&!Array.isArray(rows[0])) rows=rows.map(p=>[p.producto||p.codigo,p.marca,p.categoria,p.precio,p.distintivo,p.descripcion]); }
    else {
      if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const wb=XLSX.read(await file.arrayBuffer()); const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const hi=aoa.findIndex(r=>r.some(c=>/precio/i.test(String(c))));
      if(hi<0) throw new Error("No encontré una columna de precio.");
      const h=aoa[hi].map(c=>norm(c));
      const col=(...ks)=>h.findIndex(c=>ks.some(k=>c.includes(k)));
      const iCod=col("codigo","producto","modelo","articulo"), iMar=col("marca"), iCat=col("categ","rubro"), iPre=col("precio"), iDes=col("descrip","detalle"), iTag=col("etiqueta","distintivo");
      const num=v=> typeof v==="number"? v : Number(String(v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."))||0;
      rows=aoa.slice(hi+1).filter(r=>r[iCod]).map(r=>[r[iCod],iMar>=0?r[iMar]:"",iCat>=0?r[iCat]:"",num(r[iPre]),iTag>=0?r[iTag]:"",iDes>=0?r[iDes]:""]);
    }
    await importarLista(rows,"Archivo: "+file.name);
  }catch(e){ toast("No pude leer el archivo: "+e.message); }
}

/* buscador de clientes de la cotización */
function bindCliCombo(){
  const x=$("#cCliX"); if(x){ x.onclick=()=>{ S.cart.clienteId=""; S.cliQ=""; renderCart(); setTimeout(()=>$("#cCliQ")?.focus(),0); }; return; }
  const inp=$("#cCliQ"), list=$("#cCliL"); if(!inp) return;
  let act=0, res=[];
  const pick=id=>{ S.cart.clienteId=id; S.cliQ=""; renderCart(); };
  const draw=()=>{
    const q=norm(inp.value).split(/\s+/).filter(Boolean);
    res=S.clientes.filter(c=>{ const k=norm([c.nombre,c.cuit,String(c.cuit||"").replace(/\D/g,""),c.telefono,c.localidad].join(" ")); return q.every(w=>k.includes(w)); }).sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,8);
    act=Math.min(act,Math.max(0,res.length-1));
    list.innerHTML=res.length?res.map((c,i)=>`<div class="opt ${i===act?"on":""}" role="option" data-id="${esc(c.id)}"><b>${esc(c.nombre)}</b><span class="muted">${esc([c.cuit,c.telefono,c.localidad].filter(Boolean).join(" · "))}</span></div>`).join("")
      :`<div class="opt muted">${S.clientes.length?"Ningún cliente coincide. Usá «+ Cliente» para crearlo.":"Todavía no hay clientes cargados."}</div>`;
    list.classList.remove("hide");
  };
  inp.oninput=()=>{ S.cliQ=inp.value; act=0; draw(); };
  inp.onfocus=draw;
  inp.onblur=()=>setTimeout(()=>list.classList.add("hide"),150);
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){ act=Math.min(act+1,res.length-1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ act=Math.max(act-1,0); draw(); e.preventDefault(); }
    else if(e.key==="Enter"&&res[act]){ pick(res[act].id); e.preventDefault(); }
  };
  list.onmousedown=e=>{ const o=e.target.closest("[data-id]"); if(o){ e.preventDefault(); pick(o.dataset.id); } };
}
function resetCart(){ S.cart={id:null,clienteId:"",items:[],descuento:0,notas:"",validez:null}; S.cliQ=""; }
function cartAsCot(){ const t=cartTotals(); const ex=S.cotiz.find(x=>x.id===S.cart.id); return {numero:ex?ex.numero:nextNum(S.cotiz),fecha:ex?ex.fecha:new Date().toISOString(),clienteId:S.cart.clienteId,items:S.cart.items.map(i=>({...i})),descuento:S.cart.descuento||0,subtotal:t.sub,total:t.total,costo:t.costo,notas:S.cart.notas||"",validez:S.cart.validez??S.cfg.validez,margen:S.cfg.margen}; }
async function guardarCot(){
  if(!S.cart.clienteId){ toast("Elegí un cliente antes de guardar."); $("#cCliQ")?.focus(); return; }
  const data=cartAsCot(); const id=S.cart.id;
  const ex=S.cotiz.find(x=>x.id===id);
  data.estado=ex?ex.estado:"borrador"; data.actualizado=new Date().toISOString();
  const ref=id?S.db.doc("cotizaciones/"+id):S.db.collection("cotizaciones").doc();
  if(await write(()=>ref.set(data),"Cotización "+cotNum(data.numero)+" guardada")){ resetCart(); location.hash="cotizaciones"; }
}
function editarCot(c){ S.cart={id:c.id,clienteId:c.clienteId,items:(c.items||[]).map(i=>({...i})),descuento:c.descuento||0,notas:c.notas||"",validez:c.validez}; location.hash="cotizador"; render(); }
function duplicarCot(c){ S.cart={id:null,clienteId:c.clienteId,items:(c.items||[]).map(i=>{ const p=S.catIdx.get(i.key||i.codigo); const pv=precioDe(p); return {...i,costo:p?p.costo:i.costo,precio:pv>0?pv:i.precio,...(p&&p.foto?{foto:p.foto}:{})}; }),descuento:c.descuento||0,notas:c.notas||"",validez:null}; location.hash="cotizador"; render(); toast("Copiada con precios de la lista actual"); }
function textoCot(c){
  const cli=S.clientes.find(x=>x.id===c.clienteId);
  return `*${S.cfg.empresa}* – Presupuesto ${cotNum(c.numero)}\n${cli?"Cliente: "+cli.nombre+"\n":""}Fecha: ${fdate(c.fecha)}\n\n`+
    c.items.map(i=>`• ${i.cant} x ${i.codigo} – ${i.desc.slice(0,70)}\n   ${money(i.precio)} c/u = ${money(i.precio*i.cant)}`).join("\n")+
    `\n\n${c.descuento?`Subtotal: ${money(c.subtotal)}\nDescuento ${c.descuento}%: −${money(c.subtotal-c.total)}\n`:""}*TOTAL: ${money(c.total)}*\nValidez: ${c.validez} días.${c.notas?"\n"+c.notas:""}\n${S.cfg.pie||""}`;

async function copiarCot(c){ try{ await navigator.clipboard.writeText(textoCot(c)); toast("Copiado. Pegalo en WhatsApp o en un mail."); }catch(e){ modalTexto("Copiá este texto",textoCot(c)); } }
let pdfLibs=null;
function precargarPdf(){ if(!pdfLibs) pdfLibs=loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js").then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js")).catch(e=>{ pdfLibs=null; throw e; }); return pdfLibs; }
async function pdfCot(c){
  // el selector de carpeta tiene que pedirse enseguida después del clic, antes de armar el PDF
  const nombreArchivo=cotNum(c.numero)+" "+((S.clientes.find(x=>x.id===c.clienteId)||{}).nombre||"").replace(/[\\/:*?"<>|]/g,"").trim()+".pdf";
  let destino=null;
  if(S.cfg.pdfElegirCarpeta!==false && typeof window.showSaveFilePicker==="function"){
    try{ destino=await window.showSaveFilePicker({suggestedName:nombreArchivo,id:"jai-cotizaciones",startIn:"documents",types:[{description:"PDF",accept:{"application/pdf":[".pdf"]}}]}); }
    catch(e){ if(e&&e.name==="AbortError") return; destino=null; }
  }
  try{
    await precargarPdf(); await ensureFotos();
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210;
    const cli=S.clientes.find(x=>x.id===c.clienteId)||{};
    // encabezado con el logo
    doc.addImage(LOGO,"JPEG",12,7,64,15);
    doc.setTextColor(90,95,105); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.text([S.cfg.telefono,S.cfg.email].filter(Boolean).join("  ·  ")||"Sistemas de seguridad electrónica",14,27);
    doc.setTextColor(52,71,140); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("PRESUPUESTO "+cotNum(c.numero),W-14,14,{align:"right"});
    doc.setTextColor(90,95,105); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text("Fecha: "+fdate(c.fecha)+"   Validez: "+c.validez+" días",W-14,21,{align:"right"});
    doc.setDrawColor(31,120,200); doc.setLineWidth(0.8); doc.line(14,31,W-14,31);
    doc.setTextColor(20,27,45); doc.setFontSize(10);
    let y=40; doc.setFont("helvetica","bold"); doc.text("Cliente",14,y); doc.setFont("helvetica","normal");
    const cl=[cli.nombre||"—",[cli.cuit?"CUIT/DNI: "+cli.cuit:"",cli.condIva||""].filter(Boolean).join("  ·  "),[cli.direccion,cli.localidad].filter(Boolean).join(", "),[cli.telefono,cli.email].filter(Boolean).join(" · ")].filter(Boolean);
    doc.text(cl,14,y+5); y+=5+cl.length*4.5+4;
    const conFotos=c.items.some(i=>i.foto&&S.fotos.get(i.foto));
    const off=conFotos?1:0;
    const cs={[0+off]:{cellWidth:32},[2+off]:{halign:"right",cellWidth:13},[3+off]:{halign:"right",cellWidth:26},[4+off]:{halign:"right",cellWidth:26}};
    if(conFotos) cs[0]={cellWidth:17};
    doc.autoTable({startY:y,head:[[...(conFotos?[""]:[]),"Código","Descripción","Cant.","P. unitario","Subtotal"]],body:c.items.map(i=>[...(conFotos?[""]:[]),i.codigo,(i.marca?i.marca+" · ":"")+i.desc,i.cant,money(i.precio),money(i.precio*i.cant)]),
      styles:{fontSize:8.5,cellPadding:2,valign:"middle",minCellHeight:conFotos?16:0},headStyles:{fillColor:[52,71,140],textColor:[255,255,255],minCellHeight:0},columnStyles:cs,
      didDrawCell:d=>{ if(!conFotos||d.section!=="body"||d.column.index!==0) return; const it=c.items[d.row.index]; const u=it&&it.foto&&S.fotos.get(it.foto); if(!u) return;
        const s=Math.min(d.cell.width,d.cell.height)-3; try{ doc.addImage(u,"JPEG",d.cell.x+(d.cell.width-s)/2,d.cell.y+(d.cell.height-s)/2,s,s); }catch(e){} }});
    y=doc.lastAutoTable.finalY+6; doc.setFontSize(10);
    const line=(l,v,b)=>{ doc.setFont("helvetica",b?"bold":"normal"); doc.text(l,W-60,y); doc.text(v,W-14,y,{align:"right"}); y+=b?7:5; };
    if(c.descuento){ line("Subtotal",money(c.subtotal)); line("Descuento "+c.descuento+"%","− "+money(c.subtotal-c.total)); }
    doc.setFontSize(13); line("TOTAL",money(c.total),true); doc.setFontSize(9); doc.setFont("helvetica","normal");
    const notes=[c.notas,S.cfg.pie].filter(Boolean).join("\n"); if(notes){ doc.text(doc.splitTextToSize(notes,W-28),14,y+4); }
    const blob=doc.output("blob");
    if(destino){ const w=await destino.createWritable(); await w.write(blob); await w.close(); toast("PDF guardado: "+destino.name); return; }
    const dl=await window.claude?.use("downloads");
    if(!dl){ toast("La descarga no está disponible en esta vista."); return; }
    await dl.save({filename:nombreArchivo,data:blob});
  }catch(e){ console.error(e); if(e&&e.code==="declined") return; toast("No se pudo generar el PDF: "+(e.message||e.code||"error")); }
}

/* ---------- Cotizaciones ---------- */
// fecha en que vence: fecha de la cotización + días de validez
const vence = c => { const d=new Date(c.fecha); if(isNaN(d)) return null; d.setDate(d.getDate()+(Number(c.validez)||Number(S.cfg.validez)||7)); d.setHours(23,59,59,0); return d; };
// estado efectivo: una cotización pendiente o enviada cuyo plazo pasó se considera vencida
const estEf = c => { const e=c.estado||"borrador"; if((e==="borrador"||e==="enviada")&&!c.pedidoId){ const v=vence(c); if(v&&v<new Date()) return "vencida"; } return e; };
const esArchivada = c => { const e=estEf(c); return e==="rechazada"||e==="vencida"; };
const cotActivas = () => S.cotiz.filter(c=>!esArchivada(c));
const cotArchivadas = () => S.cotiz.filter(esArchivada);
function tablaCot(arr,archivo){
  return `<div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>${archivo?"Motivo":"Estado"}</th><th>${archivo?"Venció":"Vence"}</th><th class="r">Total</th><th></th></tr></thead><tbody>${arr.map(c=>{ const e=estEf(c), v=vence(c); return `<tr>
    <td class="mono">${cotNum(c.numero)}</td><td class="num">${fdate(c.fecha)}</td><td>${esc(cliNombre(c.clienteId))}</td>
    <td>${archivo?pillCot(e):`<select class="sm" data-est="${esc(c.id)}" aria-label="Estado">${Object.entries(ESTADOS_COT).filter(([k])=>k!=="vencida"||e==="vencida").map(([k,x])=>`<option value="${k}" ${k===e?"selected":""}>${x[0]}</option>`).join("")}</select>`}</td>
    <td class="num muted">${c.pedidoId||e==="aceptada"?"—":v?fdate(v.toISOString()):"—"}</td>
    <td class="r num">${money(c.total)}</td>
    <td class="r" style="white-space:nowrap"><button class="sm" data-act="edit" data-id="${esc(c.id)}">Abrir</button> <button class="sm" data-act="pdf" data-id="${esc(c.id)}">PDF</button> <button class="sm" data-act="dup" data-id="${esc(c.id)}" title="Hace una copia nueva con los precios de hoy">${archivo?"Reactivar con precios de hoy":"Actualizar precios"}</button>
      ${archivo?`${e==="rechazada"?`<button class="sm" data-act="reab" data-id="${esc(c.id)}">Volver a pendiente</button>`:""} <button class="ghost sm" data-act="del" data-id="${esc(c.id)}" aria-label="Borrar">✕</button>`
        :c.pedidoId?`<span class="pill p-good">Pedido hecho</span>`:`<button class="sm dark" data-act="ped" data-id="${esc(c.id)}">Pasar a pedido</button>`}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function bindCotTable(el){
  el.querySelectorAll("[data-est]").forEach(s=>s.onchange=e=>{ const v=e.target.value; const c=S.cotiz.find(x=>x.id===s.dataset.est);

    const upd={estado:v}; if((v==="borrador"||v==="enviada")&&c&&estEf(c)==="vencida") upd.fecha=new Date().toISOString();

  <div class="panel">${arr.length?tablaCot(arr,true):`<div class="empty">No hay cotizaciones archivadas.</div>`}</div>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{el.dataset.f=b.dataset.f; render();});
  bindCotTable(el);

/* ---------- Pedidos ---------- */
// número de WhatsApp en formato internacional argentino (549 + característica + número)
function waNumero(v){
  let d=String(v||"").replace(/\D/g,""); if(!d) return "";
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("54")){ d=d.slice(2); if(d.startsWith("9")) d=d.slice(1); }
  if(d.startsWith("0")) d=d.slice(1);
  return "549"+d;
}
const itemsProveedor = p => (p.items||[]).filter(i=>!i.propio&&!String(i.key||"").startsWith("P:"));

    its.map(i=>`• ${i.cant} x ${i.codigo}${i.marca?" ("+i.marca+")":""}`).join("\n")+
    `\n\n${its.reduce((a,i)=>a+i.cant,0)} unidades · Total según su lista: ${money(tot)}\nReferencia: ${pedNum(p.numero)}\n¡Gracias!`;
}
function linkProveedor(p){ const n=waNumero(S.cfg.provWhatsapp); return "https://wa.me/"+n+"?text="+encodeURIComponent(textoProveedor(p)); }

function marcarEnviado(el){ el.querySelectorAll("[data-wa]").forEach(a=>a.addEventListener("click",()=>{ const p=S.pedidos.find(x=>x.id===a.dataset.wa); if(p&&!p.provEnviado) write(()=>S.db.doc("pedidos/"+p.id).update({provEnviado:new Date().toISOString()})); })); }
function modalPedidoCreado(p){

/* ---------- Importar clientes desde Xubio ---------- */
const XCAMPOS=[
  ["nombre","Nombre / Razón social",["razon social","nombre","cliente","denominacion"]],
  ["cuit","CUIT / DNI",["cuit","cuil","numero de identificacion","nro de identificacion","nro. de identificacion","identificacion","numero de documento","nro documento","documento","dni"]],
  ["condIva","Condición IVA",["condicion iva","condicion frente al iva","categoria fiscal","condicion fiscal","categoria impositiva","responsabilidad","iva"]],
  ["telefono","Teléfono",["telefono","celular","movil","tel"]],
  ["email","Email",["e-mail","email","mail","correo"]],
  ["direccion","Dirección",["direccion","domicilio","calle"]],
  ["localidad","Localidad",["localidad","ciudad"]],
  ["provincia","Provincia",["provincia"]],
  ["codigo","Código en Xubio",["codigo"]],
  ["saldo","Saldo",["saldo"]]
];
const cuitKey = v => { const d=String(v||"").replace(/\D/g,""); return d.length>=7?d:""; };
const cliKey = c => cuitKey(c.cuit)||("n:"+norm(c.nombre).replace(/\s+/g," ").trim());
function parseNum(v){ if(typeof v==="number") return v; let s=String(v||"").trim(); if(!s) return 0; const neg=/\(.*\)/.test(s)||s.includes("-"); s=s.replace(/[^\d,.]/g,"");
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){ s= lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>=0){ s= s.match(/,/g).length>1 ? s.replace(/,/g,"") : s.replace(",","."); }
  else if(ld>=0){ if(s.match(/\./g).length>1||/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace(/\./g,""); }
  const n=Number(s)||0; return neg?-n:n; }
// palabras que descartan una columna para un campo (ej. "Tipo de identificación" no es el CUIT)
const XEXCL={cuit:["tipo"],nombre:["fantasia"],codigo:["postal","area","barra"],precio:["compra","costo"],categoria:["fiscal","iva"]};
function detectarColumnas(headers,campos=XCAMPOS){
  const h=headers.map(x=>norm(x).replace(/\s+/g," ").trim()); const used=new Set(); const map={};
  for(const [k,,syn] of campos){
    let idx=-1; const ex=XEXCL[k]||[];
    for(const s of syn){ idx=h.findIndex((c,i)=>!used.has(i)&&c&&(c===s||c.includes(s))&&!ex.some(x=>c.includes(x))); if(idx>=0) break; }
    map[k]=idx; if(idx>=0) used.add(idx);
  }
  return map;
}
async function leerExcel(file,campos,queEs){
  if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb=/\.csv$/i.test(file.name)?XLSX.read(await file.text(),{type:"string"}):XLSX.read(await file.arrayBuffer());
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
  // la fila de encabezados es la que más columnas conocidas reconoce (Xubio suele poner títulos arriba)
  let hi=-1,best=0;
  for(let i=0;i<Math.min(25,aoa.length);i++){ const m=detectarColumnas(aoa[i],campos); const sc=Object.values(m).filter(x=>x>=0).length; if(sc>best){best=sc;hi=i;} }
  if(hi<0||best<2) throw new Error("no encontré los encabezados. Revisá que sea el listado de "+queEs+".");
  const headers=aoa[hi].map(x=>String(x).trim());
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==""));
  return {headers,rows,map:detectarColumnas(headers,campos)};
}
async function leerClientesExcel(file){
  try{ const {headers,rows,map}=await leerExcel(file,XCAMPOS,"clientes"); modalImportClientes(file.name,headers,rows,map); }
  catch(e){ toast("No pude leer el archivo: "+e.message); }
}
function modalImportClientes(fname,headers,rows,map){
  const opts=sel=>`<option value="-1">— no importar —</option>`+headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h||("Columna "+(i+1)))}</option>`).join("");
  modal(`<h2>Importar clientes de Xubio</h2>
    <p class="muted" style="margin:0">${esc(fname)} · ${rows.length} filas. Revisá qué columna corresponde a cada dato.</p>
    <div class="fgrid">${XCAMPOS.map(([k,l])=>`<label class="f">${l}<select id="xm_${k}">${opts(map[k])}</select></label>`).join("")}</div>
    <div id="xmSaldo"></div>
    <div id="xmPrev"></div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="xmOk">Importar</button></div>`,
  m=>{
    const cur=()=>{ const o={}; XCAMPOS.forEach(([k])=>o[k]=+$("#xm_"+k,m).value); return o; };
    const parse=()=>{ const mp=cur(); const v=(r,k)=>mp[k]>=0?String(r[mp[k]]??"").trim():""; const out=new Map();
      for(const r of rows){ const nombre=v(r,"nombre"); if(!nombre||/^total/i.test(nombre)) continue;
        const c={nombre,cuit:v(r,"cuit"),condIva:v(r,"condIva"),telefono:v(r,"telefono"),email:v(r,"email"),direccion:v(r,"direccion"),localidad:[v(r,"localidad"),v(r,"provincia")].filter(Boolean).join(", "),codXubio:v(r,"codigo"),saldo:mp.saldo>=0?parseNum(r[mp.saldo]):0};
        out.set(cliKey(c),c); }
      return [...out.values()]; };
    const prev=()=>{
      const list=parse(); const exist=new Map(S.clientes.map(c=>[cliKey(c),c]));
      const nuevos=list.filter(c=>!exist.has(cliKey(c))).length; const conSaldo=list.filter(c=>Math.abs(c.saldo)>0.5).length;
      $("#xmPrev",m).innerHTML=`<div class="banner info">${list.length} clientes: <b>${nuevos} nuevos</b> y <b>${list.length-nuevos} ya cargados</b> (se completan sus datos, sin duplicarlos).</div>
        <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>CUIT</th><th>Teléfono</th><th>Email</th>${cur().saldo>=0?`<th class="r">Saldo</th>`:""}</tr></thead><tbody>${list.slice(0,5).map(c=>`<tr><td>${esc(c.nombre)}</td><td class="mono">${esc(c.cuit)}</td><td>${esc(c.telefono)}</td><td>${esc(c.email)}</td>${cur().saldo>=0?`<td class="r num">${money(c.saldo)}</td>`:""}</tr>`).join("")}</tbody></table></div>${list.length>5?`<p class="muted" style="font-size:13px;margin:4px 0 0">Mostrando 5 de ${list.length}.</p>`:""}`;
      $("#xmSaldo",m).innerHTML=cur().saldo>=0?`<div class="panel" style="padding:12px;display:flex;flex-direction:column;gap:8px">
        <label class="row"><input type="checkbox" id="xmUseSaldo" ${conSaldo?"checked":""}> Cargar el saldo como <b>saldo inicial</b> de la cuenta corriente (${conSaldo} clientes con saldo)</label>
        <label class="row muted" style="font-size:13.5px">Un saldo positivo en Xubio significa <select id="xmSigno"><option value="1">que el cliente me debe</option><option value="-1">saldo a favor del cliente</option></select></label>
        <span class="muted" style="font-size:12.5px">Solo se carga en clientes que todavía no tienen movimientos en el dashboard, para no duplicar deudas.</span></div>`:"";
    };
    XCAMPOS.forEach(([k])=>$("#xm_"+k,m).onchange=prev); prev();
    $("#xmOk",m).onclick=async()=>{
      if(+$("#xm_nombre",m).value<0){ toast("Elegí qué columna tiene el nombre del cliente."); return; }
      const list=parse(); if(!list.length){ toast("No encontré clientes con nombre en el archivo."); return; }
      const useSaldo=$("#xmUseSaldo",m)?.checked; const signo=+($("#xmSigno",m)?.value||1);
      const btn=$("#xmOk",m); btn.disabled=true;
      const exist=new Map(S.clientes.map(c=>[cliKey(c),c])); const conMovs=new Set(S.movs.map(x=>x.clienteId));
      let nuevos=0,act=0,saldos=0,err=0,done=0; const now=new Date().toISOString();
      const tarea=async c=>{
        const ex=exist.get(cliKey(c)); const campos={}; ["nombre","cuit","condIva","telefono","email","direccion","localidad","codXubio"].forEach(k=>{ if(c[k]) campos[k]=c[k]; });
        let id;
        if(ex){ id=ex.id; await S.db.doc("clientes/"+id).update(campos); act++; }
        else { const ref=S.db.collection("clientes").doc(); id=ref.id; await ref.set({nombre:"",cuit:"",condIva:"",telefono:"",email:"",direccion:"",localidad:"",notas:"",...campos,origen:"xubio",creado:now}); nuevos++; }
        const s=c.saldo*signo;
        if(useSaldo&&Math.abs(s)>0.5&&!conMovs.has(id)){ await S.db.collection("movimientos").doc().set({clienteId:id,fecha:now,tipo:s>0?"cargo":"pago",concepto:"Saldo inicial importado de Xubio",importe:Math.round(Math.abs(s)*100)/100,saldoInicial:true}); saldos++; }
      };
      for(let i=0;i<list.length;i+=8){
        await Promise.all(list.slice(i,i+8).map(c=>tarea(c).catch(e=>{ err++; console.error(e); })));
        done=Math.min(list.length,i+8); btn.textContent="Importando "+done+" de "+list.length+"…";
      }
      closeModal();
      toast(`Listo: ${nuevos} clientes nuevos, ${act} actualizados${saldos?`, ${saldos} saldos iniciales`:""}${err?` · ${err} con error`:""}.`);
    };
  });
}

async function leerPropiosExcel(file){

  catch(e){ toast("No pude leer el archivo: "+e.message); }
}
function modalImportPropios(fname,headers,rows,map){
  const opts=sel=>`<option value="-1">— no importar —</option>`+headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h||("Columna "+(i+1)))}</option>`).join("");
  modal(`<h2>Importar productos propios</h2>
    <p class="muted" style="margin:0">${esc(fname)} · ${rows.length} filas. Revisá qué columna corresponde a cada dato. Si solo hay costo, el precio se calcula con el margen general (${S.cfg.margen}%).</p>
    <div class="fgrid">${PCAMPOS.map(([k,l])=>`<label class="f">${l}<select id="xp_${k}">${opts(map[k])}</select></label>`).join("")}</div>
    <label class="row" style="font-size:14px"><input type="checkbox" id="xpPrune"> Borrar los productos propios que no estén en este archivo</label>
    <div id="xpPrev"></div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="xpOk">Importar</button></div>`,
  m=>{
    const cur=()=>{ const o={}; PCAMPOS.forEach(([k])=>o[k]=+$("#xp_"+k,m).value); return o; };
    const parse=()=>{ const mp=cur(); const v=(r,k)=>mp[k]>=0?String(r[mp[k]]??"").trim():""; const out=new Map();
      for(const r of rows){ let nombre=v(r,"nombre"); const extra=v(r,"descripcion"); if(extra&&norm(extra)!==norm(nombre)) nombre=nombre?nombre+" – "+extra:extra;
        const codigo=v(r,"codigo"); if(!nombre&&!codigo) continue; if(/^total/i.test(nombre)) continue;
        const p={codigo,nombre:(nombre||codigo).slice(0,300),marca:v(r,"marca"),categoria:v(r,"categoria"),costo:Math.max(0,Math.round(mp.costo>=0?parseNum(r[mp.costo]):0)),precio:Math.max(0,Math.round(mp.precio>=0?parseNum(r[mp.precio]):0))};
        out.set(propKey(p),p); }
      return [...out.values()]; };
    const prev=()=>{
      const list=parse(); const exist=new Map(S.propios.map(p=>[propKey(p),p])); const keys=new Set(list.map(propKey));
      const nuevos=list.filter(p=>!exist.has(propKey(p))).length; const borrar=S.propios.filter(p=>!keys.has(propKey(p))).length;
      const sinP=list.filter(p=>!p.precio&&!p.costo).length;
      $("#xpPrev",m).innerHTML=`<div class="banner info">${list.length} productos: <b>${nuevos} nuevos</b> y <b>${list.length-nuevos} ya cargados</b> (se actualizan).${$("#xpPrune",m).checked&&borrar?` Se borran ${borrar} que no están en el archivo.`:""}${sinP?` ${sinP} sin precio.`:""}</div>
        <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Producto</th><th class="r">Costo</th><th class="r">Venta</th></tr></thead><tbody>${list.slice(0,5).map(p=>{ const pv=p.precio||Math.round(p.costo*(1+S.cfg.margen/100)); return `<tr><td class="mono">${esc(p.codigo)}</td><td>${esc(p.nombre)}</td><td class="r num">${p.costo?money(p.costo):"—"}</td><td class="r num">${pv?money(pv):"Consultar"}</td></tr>`; }).join("")}</tbody></table></div>${list.length>5?`<p class="muted" style="font-size:13px;margin:4px 0 0">Mostrando 5 de ${list.length}.</p>`:""}`;
    };
    PCAMPOS.forEach(([k])=>$("#xp_"+k,m).onchange=prev); $("#xpPrune",m).onchange=prev; prev();
    $("#xpOk",m).onclick=async()=>{
      if(+$("#xp_nombre",m).value<0&&+$("#xp_codigo",m).value<0){ toast("Elegí qué columna tiene el nombre del producto."); return; }
      const list=parse(); if(!list.length){ toast("No encontré productos en el archivo."); return; }
      const prune=$("#xpPrune",m).checked; const btn=$("#xpOk",m); btn.disabled=true;
      const exist=new Map(S.propios.map(p=>[propKey(p),p])); const keys=new Set(list.map(propKey)); const now=new Date().toISOString();
      let nuevos=0,act=0,borr=0,err=0;
      const tarea=async p=>{ const ex=exist.get(propKey(p));
        if(ex){ const upd={nombre:p.nombre,actualizado:now}; ["codigo","marca","categoria"].forEach(k=>{ if(p[k]) upd[k]=p[k]; }); if(+$("#xp_costo",m).value>=0) upd.costo=p.costo; if(+$("#xp_precio",m).value>=0) upd.precio=p.precio; await S.db.doc("propios/"+ex.id).update(upd); act++; }
        else { await S.db.collection("propios").doc().set({...p,margen:null,origen:"importado",actualizado:now}); nuevos++; } };
      for(let i=0;i<list.length;i+=8){ await Promise.all(list.slice(i,i+8).map(p=>tarea(p).catch(e=>{err++; console.error(e);}))); btn.textContent="Importando "+Math.min(list.length,i+8)+" de "+list.length+"…"; }
      if(prune){ const del=S.propios.filter(p=>!keys.has(propKey(p))); for(let i=0;i<del.length;i+=8){ await Promise.all(del.slice(i,i+8).map(p=>S.db.doc("propios/"+p.id).delete().then(()=>borr++).catch(e=>{err++; console.error(e);}))); } }
      closeModal(); toast(`Listo: ${nuevos} productos nuevos, ${act} actualizados${borr?`, ${borr} borrados`:""}${err?` · ${err} con error`:""}.`);
    };
  });
}

/* ---------- Empleados ---------- */
const MODALIDADES=["Mensual","Quincenal","Semanal","Por día","Por hora","Por trabajo"];
const TIPOS_EMP={devengado:["A pagar","p-warn"],pago:["Pago","p-good"],adelanto:["Adelanto","p-info"],descuento:["Descuento","p-mut"]};
// saldo positivo = lo que le debo al empleado
const saldoEmp = id => S.pagosEmp.filter(m=>m.empleadoId===id).reduce((a,m)=>a+(m.tipo==="devengado"?1:-1)*(Number(m.importe)||0),0);
const mesActual = () => new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"});
function rEmpleados(el){
  if(!S.esDueno){ el.innerHTML=`<div class="empty">Esta sección es solo para el dueño.</div>`; return; }
  const emps=S.empleados.slice().sort((a,b)=>(a.activo===false)-(b.activo===false)||a.nombre.localeCompare(b.nombre));
  const sel=S.empleados.find(e=>e.id===S.selEmp);
  const mes=new Date().toISOString().slice(0,7);
  const aPagar=emps.reduce((a,e)=>a+Math.max(0,saldoEmp(e.id)),0);
  const pagadoMes=S.pagosEmp.filter(m=>(m.tipo==="pago"||m.tipo==="adelanto")&&String(m.fecha).startsWith(mes)).reduce((a,m)=>a+(Number(m.importe)||0),0);
  const adel=emps.reduce((a,e)=>a+Math.max(0,-saldoEmp(e.id)),0);
  el.innerHTML=`<div class="head"><div><h1>Empleados</h1><div class="muted">Sueldos, trabajos, adelantos y pagos. Solo lo ves vos.</div></div><button class="pri" id="eNew">Nuevo empleado</button></div>
  <div class="grid g4">
    <div class="tile alert"><span class="k">Pendiente de pago</span><span class="v">${money(aPagar)}</span><span class="s">${emps.filter(e=>saldoEmp(e.id)>0.5).length} empleado(s)</span></div>
    <div class="tile ok"><span class="k">Pagado este mes</span><span class="v">${money(pagadoMes)}</span><span class="s">Pagos y adelantos de ${mesActual()}</span></div>
    <div class="tile inf"><span class="k">Adelantos a descontar</span><span class="v">${money(adel)}</span><span class="s">Pagado de más, se descuenta del próximo</span></div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(240px,320px) minmax(0,1fr);align-items:start">
    <div class="panel">${emps.length?`<table><tbody>${emps.map(e=>{ const s=saldoEmp(e.id); return `<tr class="click" data-id="${esc(e.id)}" ${e.id===S.selEmp?'style="background:var(--accent-soft)"':""}><td>${esc(e.nombre)}${e.activo===false?` <span class="pill p-mut">Inactivo</span>`:""}<div class="muted" style="font-size:12.5px">${esc([e.puesto,e.modalidad].filter(Boolean).join(" · "))}</div></td><td class="r num ${s>0.5?"saldo-pos":s<-0.5?"saldo-neg":"muted"}">${money(s)}</td></tr>`; }).join("")}</tbody></table>`:`<div class="empty">Todavía no cargaste empleados.</div>`}</div>
    <div class="panel" id="empDet">${sel?detalleEmp(sel):`<div class="empty">Elegí un empleado para ver su cuenta.</div>`}</div>
  </div>`;
  $("#eNew",el).onclick=()=>modalEmp(null,id=>{S.selEmp=id; render();});
  el.querySelectorAll("tr[data-id]").forEach(r=>r.onclick=()=>{S.selEmp=r.dataset.id; render();});
  if(sel){
    $("#eDev",el).onclick=()=>modalMovEmp(sel,"devengado"); $("#ePago",el).onclick=()=>modalMovEmp(sel,"pago"); $("#eAdel",el).onclick=()=>modalMovEmp(sel,"adelanto");
    $("#eEdit",el).onclick=()=>modalEmp(sel);
    el.querySelectorAll("[data-delpe]").forEach(b=>b.onclick=()=>confirmar("¿Borrar este movimiento?",()=>write(()=>S.db.doc("pagosEmp/"+b.dataset.delpe).delete(),"Movimiento borrado")));
  }
}
function detalleEmp(e){
  const s=saldoEmp(e.id); let run=0;
  const movs=S.pagosEmp.filter(m=>m.empleadoId===e.id).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).map(m=>{ run+=(m.tipo==="devengado"?1:-1)*(Number(m.importe)||0); return {...m,run}; }).reverse();
  return `<div class="spread"><div><h2>${esc(e.nombre)}</h2><div class="muted" style="font-size:13.5px">${esc([e.puesto,e.modalidad&&e.monto?e.modalidad+" "+money(e.monto):e.modalidad,e.cuil&&"CUIL "+e.cuil,e.telefono,e.ingreso&&"Ingreso "+fdate(e.ingreso+"T12:00:00")].filter(Boolean).join(" · "))||"Sin datos"}</div></div>
    <div style="text-align:right"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Saldo</div><div class="num ${s>0.5?"saldo-pos":s<-0.5?"saldo-neg":""}" style="font:800 24px var(--display)">${money(Math.abs(s))}</div><div class="muted" style="font-size:12px">${s>0.5?"le debés":s<-0.5?"adelantado (a descontar)":"al día"}</div></div></div>
  <div class="row" style="margin:12px 0"><button class="sm" id="eDev">Cargar sueldo / trabajo</button><button class="pri sm" id="ePago">Registrar pago</button><button class="sm" id="eAdel">Adelanto</button><button class="ghost sm" id="eEdit">Editar datos</button></div>
  ${movs.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="r">A pagar</th><th class="r">Pagado</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${movs.map(m=>`<tr>
    <td class="num">${fdate(m.fecha)}</td><td><span class="pill ${(TIPOS_EMP[m.tipo]||TIPOS_EMP.pago)[1]}">${(TIPOS_EMP[m.tipo]||TIPOS_EMP.pago)[0]}</span> ${esc(m.concepto)}${m.medio?` <span class="muted" style="font-size:12.5px">· ${esc(m.medio)}</span>`:""}</td>
    <td class="r num">${m.tipo==="devengado"?money(m.importe):""}</td><td class="r num" style="color:var(--good)">${m.tipo!=="devengado"?money(m.importe):""}</td>
    <td class="r num ${m.run>0.5?"saldo-pos":""}">${money(m.run)}</td><td><button class="ghost sm" data-delpe="${esc(m.id)}" aria-label="Borrar">✕</button></td></tr>`).join("")}</tbody></table></div>`
    :`<div class="empty">Sin movimientos. Empezá con «Cargar sueldo / trabajo».</div>`}
  ${e.notas?`<p class="muted" style="font-size:13.5px;margin-top:12px">Notas: ${esc(e.notas)}</p>`:""}`;
}
function modalEmp(e,after){
  e=e||{};
  modal(`<h2>${e.id?"Editar empleado":"Nuevo empleado"}</h2>
    <div class="fgrid">
      <label class="f full">Nombre y apellido<input id="meNom" value="${esc(e.nombre)}"></label>
      <label class="f">Puesto<input id="mePue" value="${esc(e.puesto)}" placeholder="Ej.: Técnico instalador"></label>
      <label class="f">Teléfono<input id="meTel" value="${esc(e.telefono)}"></label>
      <label class="f">CUIL / DNI<input id="meCuil" value="${esc(e.cuil)}"></label>
      <label class="f">Fecha de ingreso<input id="meIng" type="date" value="${esc(e.ingreso)}"></label>
      <label class="f">Forma de pago<select id="meMod">${MODALIDADES.map(m=>`<option ${m===(e.modalidad||"Mensual")?"selected":""}>${m}</option>`).join("")}</select></label>
      <label class="f">Monto base (sueldo, día, hora…)<input id="meMon" type="number" min="0" value="${Number(e.monto)||""}"></label>
      <label class="row full" style="font-size:14px"><input type="checkbox" id="meAct" ${e.activo===false?"":"checked"}> Activo</label>
      <label class="f full">Notas<textarea id="meNotas" rows="2">${esc(e.notas)}</textarea></label>
    </div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="meOk">Guardar</button></div>`,
  m=>{ $("#meNom",m).focus(); $("#meOk",m).onclick=async()=>{
    const nombre=$("#meNom",m).value.trim(); if(!nombre){ toast("Escribí el nombre del empleado."); return; }
    const data={nombre,puesto:$("#mePue",m).value.trim(),telefono:$("#meTel",m).value.trim(),cuil:$("#meCuil",m).value.trim(),ingreso:$("#meIng",m).value,modalidad:$("#meMod",m).value,monto:Math.max(0,Number($("#meMon",m).value)||0),activo:$("#meAct",m).checked,notas:$("#meNotas",m).value.trim(),creado:e.creado||new Date().toISOString()};
    const ref=e.id?S.db.doc("empleados/"+e.id):S.db.collection("empleados").doc();
    if(await write(()=>ref.set(data),"Empleado guardado")){ closeModal(); after&&after(ref.id); }
  }; });
}
function modalMovEmp(e,tipo){
  const s=saldoEmp(e.id);
  const sug = tipo==="devengado" ? (Number(e.monto)||"") : tipo==="pago" ? (s>0?Math.round(s):"") : "";
  const conc = tipo==="devengado" ? ((e.modalidad==="Mensual"||!e.modalidad)?"Sueldo "+mesActual():e.modalidad==="Por trabajo"?"Trabajo: ":e.modalidad+" – ") : tipo==="pago" ? "Pago" : "Adelanto";
  modal(`<h2>${tipo==="devengado"?"Cargar sueldo o trabajo":tipo==="pago"?"Registrar pago":"Registrar adelanto"} · ${esc(e.nombre)}</h2>
    <p class="muted" style="margin:0">${tipo==="devengado"?"Suma a lo que le debés.":"Resta de lo que le debés."} Saldo actual: <b>${money(s)}</b></p>
    <div class="fgrid">
      <label class="f">Fecha<input type="date" id="mxF" value="${today()}"></label>
      ${tipo==="devengado"&&e.modalidad&&/día|hora/i.test(e.modalidad)&&e.monto?`<label class="f">Cantidad (${e.modalidad==="Por día"?"días":"horas"})<input type="number" id="mxCant" min="0" step="0.5"></label>`:`<span></span>`}
      <label class="f">Importe<input type="number" id="mxI" min="0" value="${sug}"></label>
      ${tipo!=="devengado"?`<label class="f">Medio<select id="mxM"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select></label>`:"<span></span>"}
      <label class="f full">Concepto<input id="mxC" value="${esc(conc)}"></label>
    </div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="mxOk">Guardar</button></div>`,
  m=>{ const cant=$("#mxCant",m); if(cant) cant.oninput=()=>{ $("#mxI",m).value=Math.round((Number(cant.value)||0)*(Number(e.monto)||0)); $("#mxC",m).value=(e.modalidad==="Por día"?"Días trabajados: ":"Horas trabajadas: ")+cant.value; };
    $("#mxI",m).focus();
    $("#mxOk",m).onclick=async()=>{
      const importe=Math.round(Number($("#mxI",m).value)||0); if(importe<=0){ toast("Ingresá un importe mayor a cero."); return; }
      const data={empleadoId:e.id,fecha:new Date($("#mxF",m).value+"T12:00:00").toISOString(),tipo,concepto:$("#mxC",m).value.trim()||TIPOS_EMP[tipo][0],importe};
      if(tipo!=="devengado") data.medio=$("#mxM",m).value;
      if(await write(()=>S.db.collection("pagosEmp").doc().set(data),"Guardado")) closeModal();
    }; });
}

/* ---------- modales ---------- */
function modal(html,bind){ const root=$("#modalRoot"); root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const m=root.querySelector(".modal"); root.querySelector(".modal-bg").onclick=e=>{ if(e.target.classList.contains("modal-bg")) closeModal(); }; m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); bind&&bind(m); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
function confirmar(msg,fn){ modal(`<p style="margin:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="cfOk">Confirmar</button></div>`,m=>{ $("#cfOk",m).onclick=()=>{ closeModal(); fn(); }; }); }
function modalTexto(t,txt){ modal(`<h2>${esc(t)}</h2><textarea rows="12" readonly>${esc(txt)}</textarea><div class="row" style="justify-content:flex-end"><button data-close>Cerrar</button></div>`,m=>{ const ta=m.querySelector("textarea"); ta.focus(); ta.select(); }); }

render();
initDb();
</script>
</body>
</html>
